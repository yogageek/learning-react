<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="minimum-scale=1.0, width=device-width, maximum-scale=1.0, user-scalable=no"/>
    <meta charset="utf-8">
    <title>Composition</title>
    <script src="https://unpkg.com/babel-standalone@6.15.0/babel.min.js"></script>
</head>
<body>
  <h1>Composition</h1>
  <p>Open the Console</p>
<script type="text/babel">
    // 教學重點：自訂 compose，用 reduce 把多個函式合成 oneFunction（語意同 02 巢狀版）
    // compose 解決：宣告順序 = 執行順序，避免巢狀難讀、順序寫反
    const createClockTime = date => ({date})

    const appendAMPM = ({date}) =>
      ({
          date,
          ampm: (date.getHours() >= 12) ? "PM" : "AM"
      })

    const civilianHours = clockTime => {
    const hours = clockTime.date.getHours()
      return {
        ...clockTime,
        hours: (hours > 12) ?
          hours - 12 :
          hours
      }
    }

    const removeDate = clockTime => {
      let newTime = {...clockTime}
      delete newTime.date
      return newTime
    }

    // A more elegant approach to composition

    const compose = (...fns) =>
      (arg) =>
      fns.reduce(
        (composed, f) => f(composed),
        // ...fns 收集多個函式；reduce 從 arg 開始，依序把上一步結果傳給下一個 f
        arg
    )

    const oneFunction = compose(
      createClockTime,   // 站 1
      appendAMPM,        // 站 2
      civilianHours,     // 站 3
      removeDate         // 站 4
    )
    // oneFunction(date) 等同 02：removeDate(civilianHours(appendAMPM(createClockTime(date))))

    console.log(oneFunction(new Date()))

    // compose 解決的是「宣告順序 = 執行順序」，避免巢狀難讀、順序寫反
    // reduce：composed 從 arg 開始，依序 f(composed)
    // compose(createClockTime, appendAMPM, civilianHours, removeDate)(date)
    // 與 02 巢狀 oneFunction(date) 語意相同

</script>
</body>
</html>
