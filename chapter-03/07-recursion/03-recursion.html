<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="minimum-scale=1.0, width=device-width, maximum-scale=1.0, user-scalable=no"/>
    <meta charset="utf-8">
    <title>Recursion</title>
    <script src="https://unpkg.com/babel-standalone@6.15.0/babel.min.js"></script>
</head>
<body>
  <h1>Recursion</h1>
  <p>Open the Console</p>
<script type="text/babel">
    const dan = { // 範例：多層巢狀物件，用來示範依路徑取值
        type: "person", // 頂層欄位
        data: { // 第二層
          gender: "male", // data 底下的欄位
          info: { // 第三層
            id: 22, // info.id
            fullname: { // 第四層
              first: "Dan", // 深層字串，後面 deepPick 會取到這個
              last: "Deacon" // fullname.last
            }
          }
        }
      }

    const deepPick = (fields, object={}) => { // fields 如 "a.b.c"；object 預設空物件
       const [first, ...remaining] = fields.split(".") // 路徑拆成第一段 first、其餘 remaining
       return (remaining.length) ? // 還有下一段路徑就繼續遞迴
           deepPick(remaining.join("."), object[first]) : // 往內鑽一層，剩餘路徑用 "." 接回字串
           object[first] // 最後一段：回傳該層屬性值（結束條件）
    }

    console.log( deepPick("type", dan) ) // 印 "person"（只取一層）
    console.log( deepPick("data.info.fullname.first", dan) ) // 印 "Dan"（多層路徑一路鑽到底）

    // 教學重點：遞迴處理「巢狀結構」——用 "a.b.c" 字串描述路徑，每層取 object[first] 再往內；
    // 與 countdown 相同模式：有剩餘路徑就再呼叫自己，沒有就回傳最終值。實務上類似 lodash.get。

</script>
</body>
</html>
