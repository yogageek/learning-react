<!DOCTYPE html>
<html>
  <head>
    <meta
      name="viewport"
      content="minimum-scale=1.0, width=device-width, maximum-scale=1.0, user-scalable=no"
    />
    <meta charset="utf-8" />
    <title>Pure Functions</title>
    <script src="https://unpkg.com/babel-standalone@6.15.0/babel.min.js"></script>
  </head>
  <body>
    <h1>Pure Functions</h1>
    <p>Open the console</p>
    <script type="text/babel">
      // 教學重點：有參數有回傳，但仍突變傳入物件，所以仍是不純函式
      var frederick = {
        name: "Frederick Douglass",
        canRead: false,
        canWrite: false
      };

      const selfEducate = person => {//突變傳入物件，所以仍是不純函式
        person.canRead = true;
        person.canWrite = true;
        return person;
      };

      //
      // still impure, mutates the original object
      //

      console.log(selfEducate(frederick));
      console.log(frederick);
    </script>
  </body>
</html>
