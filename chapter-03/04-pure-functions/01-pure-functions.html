<!DOCTYPE html>
<html>
  <head>
    <meta
      name="viewport"
      content="minimum-scale=1.0, width=device-width, maximum-scale=1.0, user-scalable=no"
    />
    <meta charset="utf-8" />
    <title>Pure Functions</title>
    <script src="https://unpkg.com/babel-standalone@6.15.0/babel.min.js"></script>
  </head>
  <body>
    <h1>Pure Functions</h1>
    <p>Open the console</p>
    <script type="text/babel">
      // 教學重點：不純函式——無參數、無回傳，直接改外面的 frederick
      // 不純 = 藏副作用；純 = 輸入進、新值出，好除錯、好配合 React 的 immutable state。
      // selfEducate() 不純，代表：
      // 呼叫順序會影響結果 — 先叫不叫、叫幾次，frederick 都不一樣；很難猜現在狀態。
      // 很難測、很難重現 — 函式依賴外面的 frederick，單測要先把全域資料設好。
      var frederick = {
        name: "Frederick Douglass",
        canRead: false,
        canWrite: false
      };

      function selfEducate() {
        frederick.canRead = true;
        frederick.canWrite = true;
      }

      //
      // Impure function, no arguments, no returns,
      //   and it mutates the original object
      //

      selfEducate();

      console.log(frederick);
    </script>
  </body>
</html>
