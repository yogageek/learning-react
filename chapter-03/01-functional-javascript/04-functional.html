<!DOCTYPE html>
<html>
  <head>
    <meta
      name="viewport"
      content="minimum-scale=1.0, width=device-width, maximum-scale=1.0, user-scalable=no"
    />
    <meta charset="utf-8" />
    <title>What It Means to Be Functional</title>
    <script src="https://unpkg.com/babel-standalone@6.15.0/babel.min.js"></script>
  </head>
  <body>
    <h1>Functional JavaScript</h1>
    <p>Open the console</p>
    <script type="text/babel">
      // 教學重點：函式可以放進陣列，當一般元素呼叫
      const messages = [
        "They can be inserted into arrays",
        message => console.log(message),
        "like variables",
        message => console.log(message)
      ];

      messages[1](messages[0]);//取出索引 1 的函式，把索引 0 的字串當參數傳進去 → 印出第一句
      messages[3](messages[2]);
    </script>
  </body>
</html>
