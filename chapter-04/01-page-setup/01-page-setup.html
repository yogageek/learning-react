<!DOCTYPE html>
<!--
  重點：最小可跑 React 的 HTML 骨架。
  - 掛載點 #react-container
  - 從 CDN 載入 react 與 react-dom（開發版 UMD）
  - 下方 script 預留 Pure React 程式碼位置（此檔尚未寫 UI）
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pure React Samples</title>
  </head>
  <body>
    <!-- Target Container -->
    <div id="react-container"></div>

    <!-- React Library & React DOM-->
    <script
      crossorigin
      src="https://unpkg.com/react@16/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@16/umd/react-dom.development.js"
    ></script>

    <script>
      // JavaScript Code with Pure React
    </script>
  </body>
</html>
